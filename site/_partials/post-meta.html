<div class="post-meta">
  <p class="post-published">
    {{#if is_published-}}
      Posted on {{published | date_as short_date}}
    {{#else-}}
      Drafted on {{date | date_as short_date}}
    {{#end-}}
    {{#if author-}}
      by {{author}}
    {{#end-}}
  </p>
  {{#if is_updated-}}
    <p class="post-updated">
      Last updated on {{updated | date_as short_date}}
    </p>
  {{#end-}}
  {{#if tags-}}
    <p class="post-tags">
      Tags: {{tagLinks}}
    </p>
  {{#end-}}
</div>
