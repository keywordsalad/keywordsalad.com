<figure {{#if id}}id="{{id}}"{{#end}} class="image">
<div class="aside-content">
  <p class="content">
    <a href="{{src}}" class="image-link">
      <picture>{{#if (src | as_webp)}}
      <source srcset="{{src | as_webp}}" type="image/webp">{{#end}}
      <img src="{{src}}"{{#if id}} id="{{id}}-img"{{#end-}} loading="lazy"
                        {{#if title}} title="{{title}}"{{#end-}}
                        {{#if (alt | default title)}} alt="{{alt | default title}}"{{#end-}}
                        {{#if width}} width="{{width}}"{{#end-}}
                        {{#if height}} height="{{height}}"{{#end-}}>
      </picture>
    </a>
  </p>
  {{#if title-}}
  <figcaption>{{title}}</figcaption>
  {{-#end}}
</div>
</figure>
