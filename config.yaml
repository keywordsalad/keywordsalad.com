default: &default
  site-info: &default-site-info
    title: This Field Was Green
    description: I keep my field green by writing about tech and sometimes life.
    host: http://localhost:8000
    root: ""
    author-name: Logan McGrath
    author-email: logan.mcgrath@keywordsalad.com
    linkedin-profile: https://www.linkedin.com/in/loganmcgrath
    github-profile: https://github.com/keywordsalad
    github-web-url: https://github.com/keywordsalad/keywordsalad.com
    mastodon-profile: https://tech.lgbt/@armed_banana

  display-formats:
    date-short-format: "%B %e, %Y"
    date-long-format: "%B %e, %Y %l:%M %P %EZ"
    time-format: "%l:%M %p %EZ"
    robot-date: "%Y-%m-%d"
    robot-time: "%Y-%m-%dT%H:%M:%S%Ez"
    image-widths: [320, 768, 1024, 1920, 3840]

  hakyll-config:
    provider-directory: site
    destination-directory: _site

  debug-settings:
    preview: false
    inflate-css: true
    inflate-js: true

prod:
  <<: *default
  debug-settings:
    preview: false
    inflate-css: false
  site-info:
    <<: *default-site-info
    host: https://keywordsalad.com

review:
  <<: *default
  debug-settings:
    preview: false
    inflate-css: false
  site-info:
    <<: *default-site-info
    host: https://review.keywordsalad.com

preview:
  <<: *default
  debug-settings:
    preview: true
    inflate-css: false
  site-info:
    <<: *default-site-info
    host: https://preview.keywordsalad.com
